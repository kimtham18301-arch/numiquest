<body>
<header>
  <a href="#home" class="brand">Numi<span>Quick</span></a>
  <nav>
    <button data-view="home"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><i data-vi="Trang chủ" data-en="Home"></i></button>
    <button data-view="setup"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><i data-vi="Luyện tập" data-en="Practice"></i></button>
    <button data-view="guide"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg><i data-vi="Hướng dẫn" data-en="Guide"></i></button>
    <button data-view="atlas"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><i data-vi="Mục tiêu" data-en="Goals"></i></button>
    <button data-view="stats"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7"/><path d="M14 14.66V17c0 .55.45 1 1 1h2"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><i data-vi="Thành tích" data-en="Progress"></i></button>
    <button data-view="profile"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg><i data-vi="Hồ sơ" data-en="Profile"></i></button>
    <button data-view="admin" id="navAdminBtn" style="display:none"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><i data-vi="Quản trị" data-en="Admin"></i></button>
    <button id="navMoreBtn" type="button" class="nav-more-btn" style="display:none"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg><i data-vi="Thêm" data-en="More"></i></button>
  </nav>
  <button id="themeModeBtn" class="sound-toggle" aria-label="Giao diện sáng/tối" title="Chuyển đổi giao diện Sáng / Tối">Tối</button>
  <button id="lang">EN</button>
</header>
<main id="app"></main>
<footer>NumiQuick · <span data-vi="Mỗi câu đúng, thêm một viên trân châu!" data-en="Every correct answer earns a pearl!"></span> <span class="local" data-vi="Lưu trên thiết bị · Đăng nhập để bảo vệ tiến độ học" data-en="Saved on this device · Sign in to save progress"></span></footer>
<div id="moreSheetBackdrop" class="sheet-backdrop" style="display:none"></div>
<div id="moreSheet" class="more-sheet" style="display:none" role="dialog" aria-modal="true" aria-label="Tiện ích mở rộng">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h3><span data-vi="Khám phá & Tiện ích" data-en="Explore & Utilities"></span></h3>
    <button type="button" class="sheet-close-btn" id="closeMoreSheetBtn" aria-label="Đóng">✕</button>
  </div>
  <div class="sheet-grid">
    <button type="button" class="sheet-item" data-sheet-view="guide">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg></span>
      <div class="sheet-text"><b data-vi="Hướng dẫn" data-en="Guide"></b><small data-vi="Cách học & mẹo cho phụ huynh" data-en="Student & parent guide"></small></div>
    </button>
    <button type="button" class="sheet-item" data-sheet-view="atlas">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 2v4"/><path d="M6 6h12l-1.5 14a2 2 0 0 1-2 1.8h-5a2 2 0 0 1-2-1.8L6 6z"/><circle cx="10" cy="17" r="1"/><circle cx="14" cy="17" r="1"/><circle cx="12" cy="14" r="1"/></svg></span>
      <div class="sheet-text"><b data-vi="Mục tiêu trà sữa" data-en="Milktea Goals"></b><small data-vi="Tích trân châu & nhận huy hiệu" data-en="Collect pearls & earn badges"></small></div>
    </button>
    <button type="button" class="sheet-item" id="sheetAdminItem" data-sheet-view="admin" style="display:none">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <div class="sheet-text"><b data-vi="Quản trị học sinh" data-en="Admin Management"></b><small data-vi="Giám sát & xuất báo cáo" data-en="Track & export reports"></small></div>
    </button>
    <button type="button" class="sheet-item" id="sheetLangBtn">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
      <div class="sheet-text"><b data-vi="Đổi ngôn ngữ" data-en="Language"></b><small id="sheetLangLabel">Tiếng Việt</small></div>
    </button>
    <button type="button" class="sheet-item" id="sheetDarkModeBtn">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
      <div class="sheet-text"><b data-vi="Chế độ Tối" data-en="Dark Mode"></b><small id="sheetDarkLabel" data-vi="Bảo vệ mắt ban đêm" data-en="Eye comfort mode"></small></div>
    </button>
    <button type="button" class="sheet-item" data-sheet-view="profile">
      <span class="sheet-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></span>
      <div class="sheet-text"><b data-vi="Hồ sơ & Mật khẩu" data-en="Account & Password"></b><small data-vi="Đổi lớp & chuyển tài khoản" data-en="Change grade & switch user"></small></div>
    </button>
  </div>
</div>
<dialog id="modal"><div id="modalBody"></div><button id="closeModal" class="primary" data-vi="Tiếp tục" data-en="Continue"></button></dialog>
<input id="restore" type="file" accept="application/json" hidden style="display:none">

<script src="cloud.js?v=2.3.4"></script>

<script src="ui.js?v=2.3.4"></script>
<script src="advanced.js?v=2.3.4"></script>
<script src="refresh.js?v=2.3.4"></script>
<script src="analytics.js?v=2.3.4"></script>

<script src="adaptive-sprint.js?v=2.3.4"></script>
<script src="pedagogy.js?v=2.3.4"></script>
<script src="engagement.js?v=2.3.4"></script>
<script src="admin-dashboard.js?v=2.3.4"></script>
<script src="scratchpad-kbd.js?v=2.3.4"></script>
<script src="teacher-classes.js?v=2.3.4"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      if(window.caches){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k!=='numiquick-v2.3.4').map(k=>caches.delete(k)));
      }
      navigator.serviceWorker.register('./sw.js?v=2.3.4').then(r=>r.update()).catch(()=>{});
    }catch{}
  });
}
</script>
</body>
</html>
